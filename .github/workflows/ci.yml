name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: RVD checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rvd_test
          POSTGRES_DB: rvd_ci_test
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U rvd_test -d rvd_ci_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports:
          - 127.0.0.1:6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://rvd_test:${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/rvd_ci_test
      REDIS_URL: redis://127.0.0.1:6379/0
      APP_BASE_URL: http://127.0.0.1:8765
      DEBUG: 'false'
      MIDTRANS_MOCK_MODE: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Generate ephemeral application secrets
        run: |
          python - <<'PY'
          import os, secrets
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              for name in ('SECRET_KEY', 'JWT_SECRET_KEY'):
                  value = secrets.token_hex(32)
                  print(f'::add-mask::{value}')
                  env.write(f'{name}={value}\n')
          PY
      - name: Install locked dependencies and build CSS
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip check
          npm ci --prefix deploy/assets --ignore-scripts --no-audit --no-fund
          sh scripts/build_css.sh
          npm ci --prefix tests/browser --ignore-scripts --no-audit --no-fund
          node tests/browser/node_modules/playwright/cli.js install --with-deps chromium
      - name: Validate migrations and run tests
        run: |
          python -m alembic upgrade head
          node --test tests/*.test.cjs
          python -m unittest discover -s deploy -p test_auto_deploy.py
          python -m pytest tests -q
      - name: Check browser navigation at mobile and desktop widths
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8765 > /tmp/rvd-browser.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent "$APP_BASE_URL/health" > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent "$APP_BASE_URL/health" > /dev/null
          node tests/browser/smoke.cjs
      - name: Show application log on failure
        if: failure()
        run: cat /tmp/rvd-browser.log 2>/dev/null || true
