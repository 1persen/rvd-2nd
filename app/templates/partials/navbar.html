<header class="site-header" x-data="{ mobileNavOpen: false, scrolled: false }" @keydown.escape.window="mobileNavOpen = false" @scroll.window="scrolled = window.scrollY > 20">
  <div class="site-header-inner">
    <a href="/" class="brand-lockup" aria-label="Raja Voting Digital, beranda">
      <img src="/static/img/rv.png?v={{ tailwind_css_version | default("preview", true) }}" width="36" height="36" alt="">
      <span>Raja Voting Digital</span>
    </a>

    <!-- Desktop Nav Pills -->
    <nav class="nav-pills" aria-label="Navigasi utama" x-show="!mobileNavOpen" x-cloak>
      <button type="button" class="nav-pill" data-slide="hero" aria-current="true">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>Hero</span>
      </button>
      <button type="button" class="nav-pill" data-slide="events">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        <span>Event</span>
      </button>
      <button type="button" class="nav-pill" data-slide="ticketing">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>
        <span>Tiketing</span>
      </button>
      <button type="button" class="nav-pill" data-slide="voting">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        <span>Voting</span>
      </button>
      <button type="button" class="nav-pill" data-slide="berita">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h2"/><path d="M18 14H8"/><path d="M16 10H8"/><path d="M14 6H8"/></svg>
        <span>Berita</span>
      </button>
      <button type="button" class="nav-pill" data-slide="marketplace">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>
        <span>Marketplace</span>
      </button>
      <button type="button" class="nav-pill" data-slide="paket">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3v12"/><path d="M8 11h8"/><path d="M8 7h8"/><path d="M4 15h16a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2Z"/></svg>
        <span>Paket</span>
      </button>
    </nav>

    <!-- Mobile Menu Button -->
    <button type="button" class="mobile-menu-button btn btn-ghost" @click="mobileNavOpen = !mobileNavOpen" :aria-expanded="mobileNavOpen" aria-controls="mobile-navigation" x-text="mobileNavOpen ? 'Tutup' : 'Menu'">Menu</button>

    <!-- Theme Toggle -->
    <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Aktifkan tema gelap">
      <svg class="theme-toggle-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
        <path d="M12 3v1"/>
        <path d="M12 20v1"/>
        <path d="M4.22 4.22l.71.71"/>
        <path d="M19.07 19.07l.71.71"/>
        <path d="M1 12h1"/>
        <path d="M20 12h1"/>
        <path d="M4.22 19.78l.71-.71"/>
        <path d="M19.07 4.93l.71-.71"/>
      </svg>
    </button>

    <!-- CTA Button -->
    <a href="/events" class="header-cta">Mulai Event</a>
  </div>

  <!-- Mobile Navigation (Nav Pills) -->
  <nav id="mobile-navigation" class="nav-pills" aria-label="Navigasi seluler" x-show="mobileNavOpen" x-cloak x-transition:enter="transition ease-out duration-150" x-transition:enter-start="opacity-0 transform -translate-y-2" x-transition:enter-end="opacity-100 transform translate-y-0" x-transition:leave="transition ease-in duration-100" x-transition:leave-start="opacity-100 transform translate-y-0" x-transition:leave-end="opacity-0 transform -translate-y-2">
    <button type="button" class="nav-pill" data-slide="hero" aria-current="true">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>Hero</span>
    </button>
    <button type="button" class="nav-pill" data-slide="events">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span>Event</span>
    </button>
    <button type="button" class="nav-pill" data-slide="ticketing">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>
      <span>Tiketing</span>
    </button>
    <button type="button" class="nav-pill" data-slide="voting">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      <span>Voting</span>
    </button>
    <button type="button" class="nav-pill" data-slide="berita">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h2"/><path d="M18 14H8"/><path d="M16 10H8"/><path d="M14 6H8"/></svg>
      <span>Berita</span>
    </button>
    <button type="button" class="nav-pill" data-slide="marketplace">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>
      <span>Marketplace</span>
    </button>
    <button type="button" class="nav-pill" data-slide="paket">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3v12"/><path d="M8 11h8"/><path d="M8 7h8"/><path d="M4 15h16a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2Z"/></svg>
      <span>Paket</span>
    </button>
    <a href="/admin/login" class="nav-pill" style="justify-content: center; background: var(--color-primary); color: #fff;">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/></svg>
      <span>Masuk Panitia</span>
    </a>
  </nav>
</header>
