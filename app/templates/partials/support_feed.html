{% if support_event_id %}
{% from "macros/public.html" import gift_svg %}
<div x-data='supportFeed({{ support_event_id | tojson }}, {{ (event.vote_effects if event is defined and event else []) | tojson }}, {{ (event.name if event is defined and event else "") | tojson }})' class="support-stage" aria-live="polite" aria-relevant="additions">
  <div class="support-ticker" x-show="queue.length" x-cloak aria-label="Dukungan terbaru">
    <div class="support-ticker-track" :style="'--ticker-count:' + Math.max(queue.length, 1)">
      <template x-for="(item, idx) in loopItems" :key="idx + '-' + item.id">
        <span class="support-ticker-item" x-text="item.text"></span>
      </template>
    </div>
  </div>
  <template x-if="currentEffect">
    <div class="support-effect" :class="'support-effect--' + currentEffect.animation" :style="'--gift-ms:' + currentEffect.duration_ms + 'ms'" aria-hidden="true">
      <span class="fx-backdrop"></span>
      <span class="fx-wave"></span>
      <span class="fx-trail"></span>
      <span class="fx-glint"></span>
      <span class="fx-flash"></span>
      <span class="fx-particles">
        {% for dx, dy in [(-90,-80),(-60,-120),(-30,-70),(0,-130),(30,-90),(60,-110),(90,-60),(20,-150)] %}
        <i style="--dx:{{ dx }}px;--dy:{{ dy }}px"></i>
        {% endfor %}
      </span>
      <span class="support-effect-icon" x-html="giftIcon(currentEffect.animation)"></span>
      <span class="fx-name" x-text="eventName"></span>
    </div>
  </template>
</div>
{% endif %}
