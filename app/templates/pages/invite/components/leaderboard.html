<div class="award-stage">{{ stage_header('Panggung untuk yang terdepan.') }}{{ podium('dataKlasemen') }}<div x-show="!dataKlasemen.length" class="empty-state"><h3>Jadilah dukungan pertama.</h3><p>Peringkat akan tampil setelah data peserta tersedia.</p></div><div class="stage-footer"><span>Peringkat sementara · bukan pengumuman pemenang</span><span class="live-status" :class="{ 'is-connected': connectionState === 'connected', 'is-reconnecting': connectionState === 'reconnecting', 'is-disconnected': connectionState === 'disconnected' }"><span class="live-dot" aria-hidden="true"></span><span x-text="connectionState === 'connected' ? 'Live Sync Active' : connectionState === 'reconnecting' ? 'Reconnecting…' : 'Disconnected'"></span></span><span class="viewer-count" x-show="viewerCount > 0" :aria-label="'Pengunjung aktif: ' + viewerCount"><span class="viewer-icon" aria-hidden="true">{{ icon('users') }}</span><span x-text="viewerCount"></span></span></div></div>
<div class="section-heading ranking-heading"><h2>Perjalanan <em>berlanjut.</em></h2><span class="subtle">Peringkat berikutnya</span></div>
<div class="ranking-list"><template x-for="team in dataKlasemen.slice(3)" :key="team.id"><article class="ranking-row"><span class="row-rank" x-text="String(team.rank).padStart(2, '0')"></span><div class="row-avatar"><span x-text="(team.name || '?').slice(0, 1)"></span><template x-if="team.logo_url"><img :src="team.logo_url" :alt="team.name" @error="$el.style.display = 'none'"></template></div><div class="row-person"><h3 x-text="team.name"></h3><p x-text="team.school || 'Peserta kompetisi'"></p><div class="vote-bar"><span :style="{ width: Math.min(100, (team.votes / (dataKlasemen[0]?.votes || 1)) * 100) + '%' }"></span></div></div><div class="row-votes"><strong x-text="Number(team.votes || 0).toLocaleString('id-ID')"></strong><small>vote</small></div><a x-show="!preview && event?.is_voting_open" :href="voteHref(team)" class="row-action" :aria-label="'Dukung ' + team.name" @click.prevent="openVoteModal(team, event)">{{ icon('arrow') }}</a></article></template></div>
