<div class="section-heading"><div><span class="eyebrow">KENALI PILIHANMU</span><h2>Di balik setiap <em>potensi.</em></h2></div><span class="subtle" x-text="filteredParticipants.length + ' peserta'"></span></div>
<div class="discovery-filters"><div class="field"><label for="participant-search">Cari peserta</label><input id="participant-search" type="search" x-model="participantQuery" @input="participantPage = 1" placeholder="Nama atau asal peserta"></div></div>
<div class="participant-categories" x-show="participantCategories.length" role="tablist" aria-label="Kategori peserta">
  <button type="button" role="tab" :aria-selected="activeCategory === ''" :class="{ 'is-active': activeCategory === '' }" @click="setCategory('')">Semua</button>
  <template x-for="cat in participantCategories" :key="cat"><button type="button" role="tab" :aria-selected="activeCategory === cat" :class="{ 'is-active': activeCategory === cat }" @click="setCategory(cat)" x-text="categoryLabel(cat)"></button></template>
</div>
{% if theme.show_countdown %}
<div class="participant-countdown" x-show="participantCountdown" x-cloak>
  <span class="participant-countdown-label" x-text="event?.is_voting_open ? 'Voting ditutup dalam' : 'Voting dibuka dalam'"></span>
  <div class="countdown-grid">
    <div><b x-text="String(participantCountdown?.days ?? 0).padStart(2, '0')"></b><small>HARI</small></div>
    <div><b x-text="String(participantCountdown?.hours ?? 0).padStart(2, '0')"></b><small>JAM</small></div>
    <div><b x-text="String(participantCountdown?.minutes ?? 0).padStart(2, '0')"></b><small>MENIT</small></div>
    <div><b x-text="String(participantCountdown?.seconds ?? 0).padStart(2, '0')"></b><small>DETIK</small></div>
  </div>
</div>
{% endif %}
<div class="participant-grid"><template x-for="team in paginatedParticipants" :key="team.id"><article class="participant-card"><a class="participant-card-link" :href="voteHref(team)" @click="if (preview) { $event.preventDefault(); } else if (event?.is_voting_open) { $event.preventDefault(); openVoteModal(team, event); }"><div class="participant-image"><template x-if="team.logo_url || team.photo_url"><img :src="team.logo_url || team.photo_url" :alt="team.name" loading="lazy" @error="$el.style.display = 'none'"></template><span class="participant-number" x-text="'#' + String(team.rank).padStart(2, '0')"></span><span class="participant-category-tag" x-show="team.education_level" x-text="categoryLabel(team.education_level)"></span></div><div class="participant-body"><h3 x-text="team.name"></h3><p class="participant-school" x-text="team.school || 'Peserta kompetisi'"></p><div class="participant-votes"><span aria-hidden="true">♥</span><b x-text="Number(team.votes || 0).toLocaleString('id-ID')"></b><span>suara</span></div><span class="participant-vote-btn" x-text="preview ? 'Tautan vote nonaktif saat pratinjau' : (event?.is_voting_open ? 'Vote Sekarang →' : 'Lihat Detail →')"></span></div></a><div class="participant-actions"><button type="button" :aria-label="'Bagikan ' + team.name" :disabled="preview" @click="!preview && navigator.share ? navigator.share({ title: team.name, url: window.location.origin + '/events/' + event.id + '/vote/' + team.id }) : null">Bagikan</button><button type="button" :aria-label="'Chat tentang ' + team.name" :disabled="preview">Chat</button><button type="button" :aria-label="'Unduh ' + team.name" :disabled="preview" @click="!preview && downloadFile(team.logo_url || team.photo_url, team.name)">Unduh</button></div></article></template></div>
<p x-show="dataPeserta.length && !filteredParticipants.length" class="empty-state">Tidak ada peserta yang sesuai pencarian.</p><div class="empty-state" x-show="!dataPeserta.length">{{ icon('users') }}<h3>Panggung sedang disiapkan.</h3><p>Peserta akan tampil setelah didaftarkan panitia.</p></div>
<div class="pagination" x-show="participantTotalPages > 1"><button @click="prevParticipantPage()" :disabled="participantPage <= 1">← Sebelumnya</button><span x-text="participantPage + ' / ' + participantTotalPages"></span><button @click="nextParticipantPage()" :disabled="participantPage >= participantTotalPages">Selanjutnya →</button></div>
